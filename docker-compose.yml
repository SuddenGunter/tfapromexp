version: "3"
services:
  tfa:
    build: .
    init: true
    devices:
      - '/dev/bus/usb/001/005' 
    ports:
      - "8080:4001"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4001/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s